name: Build Wardrobe (by @Adryh01)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.v.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "versions=$(jq -c '[.[].mc]' versions.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ${{ fromJson(needs.matrix.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Build
        run: |
          mkdir -p report
          set -o pipefail
          gradle build -Pmc=${{ matrix.mc }} --no-daemon --stacktrace 2>&1 | tee report/build.log
      - name: Dump API signatures
        if: always()
        run: |
          gradle writeClasspath -Pmc=${{ matrix.mc }} --no-daemon -q && bash ci/probe.sh > report/api.txt || true
          cp build/libs/*.jar report/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.mc }}
          path: report
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: wardrobe-${{ matrix.mc }}
          path: build/libs/*.jar

  report:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: report-*
          path: reports
      - name: Save logs on the ci-logs branch
        run: |
          cd reports
          echo "${{ github.sha }}" > commit.txt
          git init -q -b ci-logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Build report for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wardrobe-*
          path: jars
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Wardrobe (tutte le versioni)
          target_commitish: ${{ github.sha }}
          files: jars/*.jar
